    <circle cx="770" cy="286" r="20" fill="#14B8A6" />
    <circle cx="844" cy="350" r="20" fill="#34D399" />
    <circle cx="959" cy="176" r="20" fill="#22C55E" />
    <rect x="470" y="512" width="38" height="96" rx="8" fill="#2954E6" />
