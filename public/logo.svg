      <stop offset="1" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="wordmarkBlue" x1="340" y1="630" x2="860" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1F57" />
      <stop offset="1" stop-color="#102B78" />
    </linearGradient>
    <filter id="softShadow" x="0" y="0" width="1200" height="900" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0B1F57" flood-opacity="0.14" />
    </filter>
  </defs>

