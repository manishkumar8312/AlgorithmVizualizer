<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Algo Visualizer</title>
  <desc id="desc">Blue and green algorithm visualizer logo with a line chart, bars, and wordmark.</desc>
  <defs>
    <linearGradient id="brandBlue" x1="160" y1="160" x2="560" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F62FE" />
      <stop offset="1" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="brandTeal" x1="520" y1="210" x2="910" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06B6D4" />
